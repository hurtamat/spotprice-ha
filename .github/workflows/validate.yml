name: Validate

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    # Hassfest and HACS track Home Assistant releases, so re-run weekly to catch
    # a rule that started failing without us touching anything.
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black
      - run: black --check custom_components
